<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820" role="img" aria-label="Diagrama da Arquitetura do Motor de Renda Variável C++23">
  <defs>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.10)"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0.15)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.08)"/>
    </linearGradient>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="760" height="820" rx="16" fill="#080c14" stroke="#1e293b" stroke-width="1"/>

  <!-- Grid overlay subtle -->
  <g opacity="0.08">
    <path d="M0 40 H760 M0 80 H760 M0 120 H760 M0 160 H760 M0 200 H760 M0 240 H760 M0 280 H760 M0 320 H760 M0 360 H760 M0 400 H760 M0 440 H760 M0 480 H760 M0 520 H760 M0 560 H760 M0 600 H760 M0 640 H760 M0 680 H760 M0 720 H760 M0 760 H760 M0 800 H760" stroke="#38bdf8" stroke-width="0.5"/>
    <path d="M40 0 V820 M80 0 V820 M120 0 V820 M160 0 V820 M200 0 V820 M240 0 V820 M280 0 V820 M320 0 V820 M360 0 V820 M400 0 V820 M440 0 V820 M480 0 V820 M520 0 V820 M560 0 V820 M600 0 V820 M640 0 V820 M680 0 V820 M720 0 V820" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- 1. Camada de Ingestão Externa (Fontes) -->
  <g filter="url(#boxShadow)">
    <rect x="50" y="32" width="200" height="58" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="70" cy="51" r="4" fill="#38bdf8"/>
    <text x="82" y="52" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Market data B3</text>
    <text x="82" y="72" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">UMDF binário (SBE)</text>

    <rect x="280" y="32" width="200" height="58" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="300" cy="51" r="4" fill="#22c55e"/>
    <text x="312" y="52" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Negócios</text>
    <text x="312" y="72" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">FIX 4.4 drop copy</text>

    <rect x="510" y="32" width="200" height="58" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="530" cy="51" r="4" fill="#a855f7"/>
    <text x="542" y="52" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Proventos &amp; EOD</text>
    <text x="542" y="72" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Eventos e cotações</text>
  </g>

  <!-- Linhas para Ingress -->
  <line x1="150" y1="90" x2="150" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="380" y1="90" x2="380" y2="130" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="610" y1="90" x2="610" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Ingress Router -->
  <g filter="url(#boxShadow)">
    <rect x="50" y="130" width="660" height="64" rx="12" fill="url(#accentGlow)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="380" y="157" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e0f2fe">Ingress Threads (Decode SBE Zero-Copy &gt;120M ops/s)</text>
    <text x="380" y="177" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">hash(CPF/CNPJ) → Roteamento Determinístico para Partição Dona</text>
  </g>

  <!-- Seta Ingress -> Núcleo -->
  <line x1="380" y1="194" x2="380" y2="236" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- 2. Núcleo Shared-Nothing -->
  <g filter="url(#boxShadow)">
    <rect x="36" y="240" width="688" height="264" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 4"/>
    <rect x="56" y="250" width="310" height="26" rx="6" fill="#0369a1"/>
    <text x="68" y="267" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">NÚCLEO — THREAD-PER-CORE, SHARED-NOTHING</text>

    <!-- Partição Box -->
    <rect x="56" y="290" width="310" height="84" rx="10" fill="url(#coreGlow)" stroke="#0284c7" stroke-width="1.2"/>
    <text x="74" y="316" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f0f9ff">Partição k (Single-Writer Core)</text>
    <text x="74" y="338" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#bae6fd">Ledger Custódia (SoA) + Caixa BRL</text>
    <text x="74" y="356" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">Zero locks · SPSC ring · Fixed point</text>

    <!-- Conexão Partição -> WAL -->
    <line x1="366" y1="332" x2="410" y2="332" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowDark)"/>

    <!-- WAL Box -->
    <rect x="414" y="290" width="290" height="84" rx="10" fill="url(#coreGlow)" stroke="#a855f7" stroke-width="1.2"/>
    <text x="432" y="316" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#faf5ff">WAL + Persistência io_uring</text>
    <text x="432" y="338" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e9d5ff">Group Commit 100µs · O_DIRECT</text>
    <text x="432" y="356" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">SINGLE_ISSUER · CRC32C HW · Replay I11</text>

    <!-- Saídas do Núcleo -->
    <line x1="211" y1="374" x2="211" y2="408" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowDark)"/>
    <line x1="559" y1="374" x2="559" y2="408" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowDark)"/>

    <!-- Read Models -->
    <rect x="56" y="412" width="310" height="72" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1.2"/>
    <text x="74" y="438" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Read Model Intradiário</text>
    <text x="74" y="458" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Canais internos, stream tempo real</text>

    <rect x="414" y="412" width="290" height="72" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1.2"/>
    <text x="432" y="438" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Snapshot D-1 Imutável (EOD)</text>
    <text x="432" y="458" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Mapeado em memória para Open Finance</text>
  </g>

  <!-- Seta para Camada Open Finance -->
  <line x1="559" y1="484" x2="559" y2="538" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- 3. Camada Open Finance (Transmissora) -->
  <g filter="url(#boxShadow)">
    <rect x="36" y="540" width="688" height="154" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="#22c55e" stroke-width="1" stroke-dasharray="6 4"/>
    <rect x="56" y="550" width="300" height="26" rx="6" fill="#15803d"/>
    <text x="68" y="567" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CAMADA OPEN FINANCE (TRANSMISSORA)</text>

    <!-- AS Box -->
    <rect x="56" y="590" width="310" height="84" rx="10" fill="url(#greenGlow)" stroke="#16a34a" stroke-width="1.2"/>
    <text x="74" y="616" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#dcfce7">AS Certificado FAPI-BR v2.2.1</text>
    <text x="74" y="638" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86efac">private_key_jwt · PAR · PKCE</text>
    <text x="74" y="656" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">Servidor de autorização de prateleira (ADR-0002)</text>

    <!-- Seta AS <-> RS -->
    <line x1="366" y1="632" x2="410" y2="632" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- Resource Server Box -->
    <rect x="414" y="590" width="290" height="84" rx="10" fill="url(#greenGlow)" stroke="#16a34a" stroke-width="1.2"/>
    <text x="432" y="616" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#dcfce7">Resource Server C++ (motor-rv)</text>
    <text x="432" y="638" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86efac">mTLS ICP-Brasil · JWT PS256</text>
    <text x="432" y="656" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">API Renda Variável 1.3.0 · Snapshot D-1</text>
  </g>

  <!-- 4. Entidades Externas -->
  <line x1="211" y1="720" x2="211" y2="674" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="559" y1="720" x2="559" y2="674" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <g filter="url(#boxShadow)">
    <rect x="56" y="726" width="310" height="52" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1"/>
    <text x="211" y="757" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Diretório de Participantes Open Finance</text>

    <rect x="414" y="726" width="290" height="52" rx="10" fill="url(#coreGlow)" stroke="#334155" stroke-width="1"/>
    <text x="559" y="757" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Instituições Receptoras de Dados</text>
  </g>
</svg>
