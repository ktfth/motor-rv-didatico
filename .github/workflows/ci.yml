# CI do motor-rv.
#
# Todo gate deste arquivo já existia como script no repositório e dependia de alguém digitar o
# comando. Um gate que ninguém roda não é gate — e uma revisão independente mostrou dois que
# reportavam VERDE sem ter feito nada (LTO nunca ligava; o preset tsan selecionava zero testes).
# Por isso o CI não só roda: ele confere que os gates fizeram alguma coisa.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, clang-release, asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang liburing-dev libssl-dev libfmt-dev libzstd-dev \
            libgtest-dev libgmock-dev python3
          echo "cmake $(cmake --version | head -1)"
          echo "gcc   $(g++ --version | head -1)"
          echo "clang $(clang++ --version | head -1)"

      - name: sondagem do ambiente
        run: ./scripts/probe-ambiente.sh || true

      - name: configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: testar
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # O preset `tsan` só tem valor se selecionar alguma coisa. O filtro apontava para um rótulo
      # que nenhum CMakeLists declarava, e o CTest saía 0 tendo rodado zero testes.
      - name: tsan roda mesmo o teste de concorrência
        if: matrix.preset == 'tsan'
        run: |
          n=$(ctest --preset tsan-concorrencia -N | grep -c 'Test *#') || true
          echo "testes com rótulo concorrencia: $n"
          test "$n" -ge 1 || { echo "::error::o preset tsan não selecionou nenhum teste"; exit 1; }
          ctest --preset tsan-concorrencia --output-on-failure

      # `release` anuncia LTO. Já anunciou sem ligar.
      - name: release liga LTO de verdade
        if: matrix.preset == 'release'
        run: |
          cmake --preset release 2>&1 | tee /tmp/cfg.txt
          grep -q "LTO ligado" /tmp/cfg.txt || { echo "::error::LTO não ligou"; exit 1; }

  gates:
    name: gates do projeto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake liburing-dev libssl-dev libfmt-dev libzstd-dev \
            libgtest-dev libgmock-dev python3
      - run: cmake --preset debug && cmake --build --preset debug

      # "Invariante sem teste não existe" (docs/invariantes.md) — mecanizado.
      - name: todo invariante tem teste
        run: python3 scripts/check_invariants.py build/debug

      # O calendário é dado de entrada; se o gerador mudar, as datas dos cenários golden mudam.
      - name: o calendário gerado é o versionado
        run: |
          python3 scripts/gera-calendario.py 2026 /tmp/cal.csv
          diff -q /tmp/cal.csv data/calendario-b3-2026.csv \
            || { echo "::error::data/calendario-b3-2026.csv difere do que o gerador produz"; exit 1; }

      # O gerador de codecs recusa schema inválido — e recusar é metade do valor dele.
      - name: o gerador SBE recusa schema inválido
        run: |
          python3 scripts/sbe_gen.py schema/events.xml --check
          set +e
          printf '%s\n' '<?xml version="1.0"?>' \
            '<sbe:messageSchema xmlns:sbe="http://fixprotocol.io/2016/sbe" package="p" id="1" version="1">' \
            '<types/><sbe:message name="A" id="1"><field name="x" id="1" type="double"/></sbe:message>' \
            '</sbe:messageSchema>' > /tmp/ruim.xml
          python3 scripts/sbe_gen.py /tmp/ruim.xml --check
          test $? -ne 0 || { echo "::error::o gerador aceitou ponto flutuante"; exit 1; }

      # A propriedade central do motor: mesma semente, mesmo resultado.
      - name: determinismo do motor
        run: |
          ./build/debug/src/app/motor-rv-sim --dias 3 --negocios 3000 --investidores 400 > /tmp/a.txt
          ./build/debug/src/app/motor-rv-sim --dias 3 --negocios 3000 --investidores 400 > /tmp/b.txt
          diff -u /tmp/a.txt /tmp/b.txt \
            || { echo "::error::o motor não é determinístico"; exit 1; }
          grep -q "I3  (bucket não negativo)  : ok" /tmp/a.txt \
            || { echo "::error::I3 violado na simulação"; exit 1; }
          # A soma da tabela de rejeições tem de bater com o total: relatório incompleto mente.
          grep -q "NAO BATE COM O TOTAL" /tmp/a.txt \
            && { echo "::error::contagem de rejeições inconsistente"; exit 1; }
          cat /tmp/a.txt

      # A quantidade de partições não pode mudar o resultado agregado do motor.
      # ADR-0005, verificado: o estado agregado não depende de em quantos cores ele foi dividido.
      #
      # Não se compara "eventos aceitos": `DayOpened`, `ClosingPriceSet`, `CustodyReconciled` e
      # `EodMarked` são emitidos POR partição, então esse número cresce com o particionamento e
      # cresce corretamente. O que tem de ser idêntico é a soma dos checksums — que percorre o
      # mesmo conjunto de posições em qualquer arranjo — e a contagem de rejeições.
      - name: o estado agregado não depende do número de partições
        run: |
          for n in 1 2 4 8; do
            ./build/debug/src/app/motor-rv-sim --dias 2 --negocios 2000 --investidores 300 \
              --particoes $n > /tmp/p$n.txt
            printf '%s %s\n' "$(grep '^  TOTAL' /tmp/p$n.txt | sed 's/.*custódia=//')" \
                              "$(grep -E '^tot' /tmp/p$n.txt | awk '{print $3}')"
          done | tee /tmp/part.txt
          test "$(sort -u /tmp/part.txt | wc -l)" -eq 1 \
            || { echo "::error::o estado agregado mudou com o número de partições"; cat /tmp/part.txt; exit 1; }

      # A imagem de recuperação tem de ser proporcional ao DADO, não à capacidade configurada.
      # Ela já foi 126 MiB com dez negócios; o stall diário dependia de quanto alguém dimensionou.
      - name: a imagem de recuperação escala com o dado
        run: |
          pequeno=$(./build/debug/src/app/motor-rv-sim --dias 1 --negocios 10 --investidores 5 \
                    | awk '/partição 0:/{print $3}')
          grande=$(./build/debug/src/app/motor-rv-sim --dias 1 --negocios 20000 --investidores 2000 \
                   | awk '/partição 0:/{print $3}')
          echo "imagem: 10 negócios = $pequeno MiB | 20000 negócios = $grande MiB"
          # Se a imagem voltasse a copiar a arena, as duas seriam idênticas (~126 MiB). A
          # afirmação direta é a de cima: um dia com dez negócios não pode produzir megabytes.
          awk -v p="$pequeno" -v g="$grande" 'BEGIN{
            if (p > 5.0)     { print "::error::imagem de 10 negócios = " p " MiB: não escala com o dado"; exit 1 }
            if (g <= p * 5)  { print "::error::a imagem não cresce com o volume"; exit 1 }
          }'

      # A tabela de negócios tem de ESTABILIZAR: sem a baixa diária, o limite de quantos dias o
      # motor roda não é o disco, é a memória.
      - name: a tabela de negócios estabiliza
        run: |
          for d in 4 16; do
            ./build/debug/src/app/motor-rv-sim --dias $d --negocios 3000 --investidores 300 \
              | awk -v d=$d '/^0 /{print d, $7}'
          done | tee /tmp/tab.txt
          a=$(awk 'NR==1{print $2}' /tmp/tab.txt); b=$(awk 'NR==2{print $2}' /tmp/tab.txt)
          echo "negócios abertos: 4 dias = $a | 16 dias = $b"
          test "$b" -lt $((a * 2)) \
            || { echo "::error::a tabela de negócios cresce com o número de dias"; exit 1; }

  bench:
    name: harness de medição
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake liburing-dev libssl-dev libfmt-dev libzstd-dev \
            libgtest-dev libgmock-dev python3
      - run: cmake --preset release && cmake --build --preset release

      # O que este job NÃO faz: comparar com bench/baseline.json.
      #
      # Um runner do GitHub não é a máquina de referência (ADR-0022), e um baseline fixado lá
      # reprovaria todo PR aqui por diferença de hardware. Um gate que reprova por motivo errado é
      # desligado com raiva em três meses, e junto com ele vai o gate que funcionava. A comparação
      # com o baseline é rodada por `desempenho` na máquina de referência.
      #
      # O que ele faz: garantir que o harness RODA, que produz o JSON no esquema certo e que o
      # comparador ainda sabe reprovar. Código de gate que ninguém executa apodrece igual a
      # qualquer outro.
      - name: o harness roda e produz o JSON
        run: |
          ./build/release/bench/motor-rv-bench --rapido --silencioso \
            --negocios 2000 --investidores 300 --dir-wal "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/medicao.json"
          python3 - "$RUNNER_TEMP/medicao.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          for chave in ("schema", "ambiente", "harness", "carga", "metricas",
                        "metricas_ausentes", "series"):
              assert chave in d, f"falta '{chave}' no JSON da medição"
          assert d["carga"]["eventos"] > 0, "a carga não foi registrada"
          assert len(d["series"]) >= 15, f"séries de menos: {len(d['series'])}"
          for s in d["series"]:
              assert s["medida"] or s["nota"], f"série pulada sem motivo: {s['nome']}"
          print(f"ok: {len(d['series'])} séries, {d['carga']['eventos']} eventos")
          PY

      # O comparador tem de saber dizer NÃO. Dois baselines sintéticos, um que nenhuma máquina
      # reprova e um que nenhuma máquina aprova: o veredito não depende de quão rápido é o runner.
      - name: o comparador reprova regressão e recusa carga diferente
        run: |
          carga='"carga": { "dias": 1, "negocios_por_dia": 2000, "investidores": 300,
                            "particoes": 1, "semente": 20260902, "eventos": 0 },'
          cat > "$RUNNER_TEMP/frouxo.json" <<FIM
          { "schema": 1, "limiar_regressao_pct": 5, $carga
            "metricas": { "nucleo.eventos_por_s_por_core": 1000.0 } }
          FIM
          cat > "$RUNNER_TEMP/apertado.json" <<FIM
          { "schema": 1, "limiar_regressao_pct": 5, $carga
            "metricas": { "nucleo.eventos_por_s_por_core": 1000000000.0 } }
          FIM
          cat > "$RUNNER_TEMP/outra-carga.json" <<FIM
          { "schema": 1, "limiar_regressao_pct": 5,
            "carga": { "dias": 99, "negocios_por_dia": 2000, "investidores": 300,
                       "particoes": 1, "semente": 20260902, "eventos": 0 },
            "metricas": { "nucleo.eventos_por_s_por_core": 1000.0 } }
          FIM
          comum="--rapido --silencioso --suites nucleo --negocios 2000 --investidores 300"

          ./build/release/bench/motor-rv-bench $comum --comparar "$RUNNER_TEMP/frouxo.json"
          echo "baseline frouxo: aprovou, como devia"

          set +e
          ./build/release/bench/motor-rv-bench $comum --comparar "$RUNNER_TEMP/apertado.json"
          test $? -eq 3 || { echo "::error::o comparador NÃO reprovou uma regressão de 1000x"; exit 1; }
          ./build/release/bench/motor-rv-bench $comum --comparar "$RUNNER_TEMP/outra-carga.json"
          test $? -eq 4 || { echo "::error::o comparador comparou cargas diferentes"; exit 1; }
          set -e
          echo "o comparador reprova regressão (3) e recusa carga diferente (4)"

      # Medir com o preset errado é o erro que contamina todos os PRs seguintes, e ele não dá
      # sintoma: o número simplesmente fica menor. O harness tem de RECUSAR.
      - name: o harness recusa gravar baseline fora do release
        run: |
          cmake --preset debug && cmake --build --preset debug
          set +e
          ./build/debug/bench/motor-rv-bench --rapido --silencioso --suites nucleo \
            --negocios 500 --investidores 100 \
            --gravar-baseline "$RUNNER_TEMP/nao-deve-existir.json"
          test $? -ne 0 || { echo "::error::o harness gravou baseline a partir do preset debug"; exit 1; }
          set -e
          test ! -f "$RUNNER_TEMP/nao-deve-existir.json" \
            || { echo "::error::o arquivo foi criado apesar da recusa"; exit 1; }

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake liburing-dev libssl-dev libfmt-dev libzstd-dev \
            libgtest-dev libgmock-dev python3 wget gnupg lsb-release software-properties-common

      # O clang-tidy 18, que é o do Ubuntu 24.04, CRASHA analisando src/app/simulador_main.cpp
      # ("PLEASE submit a bug report"). É defeito da ferramenta, não do código: o 22 passa limpo.
      # Fixar a versão aqui é preferível a excluir o arquivo — excluir esconderia o arquivo de toda
      # análise futura por causa de um bug que será corrigido.
      - name: clang-tidy ${{ env.TIDY }} (o 18 do Ubuntu quebra)
        env:
          TIDY: "20"
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$TIDY main"
          sudo apt-get install -y --no-install-recommends clang-$TIDY clang-tidy-$TIDY
          clang-tidy-$TIDY --version

      - name: configurar
        run: |
          cmake --preset tidy \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCLANG_TIDY_EXE=/usr/bin/clang-tidy-20
      - name: analisar
        run: cmake --build --preset tidy
